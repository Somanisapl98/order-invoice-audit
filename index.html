<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Invoice Audit Control Tower</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body>
<div id="toast"></div><section id="login" class="center"><form class="login card3d" id="loginForm"><div class="logo">◆</div><h1>Audit Control Tower</h1><p>Secure Order, Invoice & Discount Review</p><label>Email ID<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">Sign In Securely</button><small id="loginMsg"></small></form></section>
<section id="app" hidden><header><div><h1>Order vs Invoice Audit</h1><p id="welcome">Live secured operations dashboard</p></div><div class="actions"><button id="refreshBtn">↻ Refresh</button><button id="saveAllBtn" class="primary">Save All Changes</button><button id="logoutBtn" class="danger">Sign Out</button></div></header>
<main><nav><button class="tab active" data-view="updates">New Updates</button><button class="tab" data-view="all">All Records</button><button class="tab" data-view="history">Audit History</button></nav>
<div class="filters"><input id="search" placeholder="Search order, invoice, customer, item"><select id="branch"><option value="">All Branches</option></select><select id="salesman"><option value="">All Salespeople</option></select><select id="status"><option value="">All Status</option><option>Pending</option><option>Reviewed</option><option>Correction Required</option><option>Resolved</option></select><input id="fromDate" type="date" title="Updated after date"></div>
<div class="cards" id="cards"></div><div class="grid"><section class="panel"><h2>Easy Audit Summary</h2><div id="summary" class="summary"></div></section><section class="panel"><h2>Average Discount</h2><div id="discountSummary" class="summary"></div></section></div>
<section class="panel dataPanel"><div class="panelTop"><h2 id="tableTitle">New Updates</h2><span id="dirtyCount">0 unsaved</span></div><div class="scroll"><table><thead><tr><th>Audit</th><th>Status</th><th>Order</th><th>Invoice</th><th>Customer</th><th>Salesperson</th><th>Item</th><th>Order ₹</th><th>Invoice ₹</th><th>Difference ₹</th><th>Discount %</th><th>Discount ₹</th><th>Comment</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></section>
<script src="app.js"></script></body></html>
