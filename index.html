<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Control Tower</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><section id="login" class="loginScreen"><form id="loginForm" class="loginCard"><h1>Audit Control Tower</h1><p>Secure Order, Invoice & Discount Review</p><label>Email ID<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button id="signInBtn">Sign In Securely</button><small id="loginMsg"></small></form></section><section id="app" hidden><header><div><h1>Order vs Invoice Audit</h1><p id="welcome"></p></div><div><button id="refreshBtn">Refresh</button><button id="logoutBtn">Sign Out</button></div></header><main><div class="cards"><article><small>Total Records</small><strong id="recordCount">0</strong></article><article><small>Pending Audit</small><strong id="pendingCount">0</strong></article><article><small>Audited</small><strong id="auditedCount">0</strong></article><article><small>Order Value</small><strong id="orderValue">₹0</strong></article><article><small>Invoice Value</small><strong id="invoiceValue">₹0</strong></article><article><small>Net Difference</small><strong id="differenceValue">₹0</strong></article><article><small>Average Discount</small><strong id="averageDiscount">0%</strong></article><article><small>Unsaved</small><strong id="unsaved">0 unsaved</strong></article></div><p id="dataMsg"></p><div class="page-controls"><button id="previousPage">← Previous</button><span id="pageInformation">Page 1</span><button id="nextPage">Next →</button><select id="pageSize"><option value="100">100 rows</option><option value="250">250 rows</option><option value="500" selected>500 rows</option></select></div><section class="panel"><div class="scroll"><table><thead><tr><th>Audit</th><th>Order</th><th>Invoice</th><th>Customer</th><th>Salesperson</th><th>Item</th><th>Discount %</th><th>Status</th><th>Comment</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></section><script src="app.js"></script></body></html>
